# Runs HEMTT's config and SQF checks on every push and pull request. HEMTT is pinned to the local version.
name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  HEMTT_VERSION: "1.22.0"

jobs:
  hemtt:
    name: hemtt check
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install HEMTT
        run: |
          curl -sSfL -o hemtt.zip \
            "https://github.com/BrettMayson/HEMTT/releases/download/v${HEMTT_VERSION}/linux-x64.zip"
          unzip -q hemtt.zip
          chmod +x hemtt
          ./hemtt --version

      - name: Check configs and SQF
        run: ./hemtt check
